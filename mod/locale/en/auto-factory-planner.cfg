[mod-name]
auto-factory-planner=Auto Factory Planner
[mod-description]
auto-factory-planner=Public alpha. Plan production rates and multi-product malls, generate blueprints and update controller factories. Researched recipes, stable inputs and optional roboports. Space Age is optional. English and Russian UI.
